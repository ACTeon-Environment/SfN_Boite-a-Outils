<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boîte à outils – Évaluation économique des SfN</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="container hero-grid">
      <div class="hero-copy">
        <p class="eyebrow">Évaluation économique des Solutions fondées sur la Nature</p>
        <h1>Boîte à outils SfN</h1>
        <p class="intro">
          Un parcours guidé pour identifier, évaluer et présenter les impacts socio-économiques
          d’un projet de Solution fondée sur la Nature.
        </p>
      </div>
      <div class="partner-logos" aria-label="Partenaires du projet">
        <div class="logo-card"><img src="images/logo-acteon.jpg" alt="ACTeon – ecological mindsets"></div>
        <div class="logo-card aeag"><img src="images/logo-aeag.png" alt="République Française – Agence de l'eau Adour-Garonne"></div>
      </div>
    </div>
  </header>

  <nav class="site-nav" aria-label="Navigation principale">
    <div class="container site-nav-inner">
      <div class="site-nav-left">
        <button class="site-nav-item active" data-page="guide">Note introductive</button>
      </div>

      <div class="site-nav-center">
        <button class="site-nav-item" data-page="toolbox">Réaliser mon évaluation</button>
      </div>

      <div class="site-nav-right">
        <button class="site-nav-item" data-page="categorization">Définitions et repères</button>
        <button class="site-nav-item" data-page="glossary">Glossaire</button>
        <button class="site-nav-item" data-page="references">Références</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <nav id="progress" class="progress" aria-label="Progression dans l’outil"></nav>
    <section id="app" class="card" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="container">Boîte à outils d’évaluation économique des Solutions fondées sur la Nature</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
